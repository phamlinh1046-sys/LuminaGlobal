# ============================================================
#  LUMINA — Nginx Wildcard Subdomain
#  *.luminaglobal.info.vn  +  luminaglobal.info.vn (root)
#
#  Prerequisites:
#    DNS:  A  *.luminaglobal.info.vn  →  VPS_IP
#    SSL:  certbot certonly --manual --preferred-challenges dns
#            -d luminaglobal.info.vn -d "*.luminaglobal.info.vn"
# ============================================================

# HTTP → HTTPS
server {
    listen 80;
    server_name luminaglobal.info.vn *.luminaglobal.info.vn;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── MAIN DOMAIN ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name luminaglobal.info.vn www.luminaglobal.info.vn;

    ssl_certificate     /etc/letsencrypt/live/luminaglobal.info.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luminaglobal.info.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html/lumina;
    index index.php;

    # Lumina platform (main landing)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # BAT product tại /becomingatrainer/
    location /becomingatrainer/ {
        alias /var/www/html/lumina/products/becomingatrainer/;
        index index.html index.php;
        try_files $uri $uri/ /becomingatrainer/index.html;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(env|db|sqlite|htaccess)$ { deny all; }
}

# ── WILDCARD SUBDOMAINS: *.luminaglobal.info.vn ──────────────
server {
    listen 443 ssl http2;
    server_name *.luminaglobal.info.vn;

    ssl_certificate     /etc/letsencrypt/live/luminaglobal.info.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luminaglobal.info.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html/lumina;
    index index.php;
    client_max_body_size 10M;

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\.(env|db|sqlite|htaccess)$ { deny all; }
}
