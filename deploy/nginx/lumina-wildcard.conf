# ============================================================
#  LUMINA — Nginx Config
#  Main domain + wildcard subdomains
#  SSL: dùng cert luminaglobal.info.vn cho main domain
#       Wildcard subdomains cần cert riêng (xem bước SSL)
# ============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name luminaglobal.info.vn *.luminaglobal.info.vn;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── MAIN DOMAIN: luminaglobal.info.vn ────────────────────────
server {
    listen 443 ssl http2;
    server_name luminaglobal.info.vn www.luminaglobal.info.vn;

    ssl_certificate     /etc/letsencrypt/live/luminaglobal.info.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luminaglobal.info.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/html/lumina;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Lumina platform
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # BAT product tại /becomingatrainer/
    location /becomingatrainer/ {
        alias /var/www/html/lumina/products/becomingatrainer/;
        index index.html index.php;
        try_files $uri $uri/ /becomingatrainer/index.html;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(env|db|sqlite|htaccess|git)$ { deny all; }
}

